{% extends "base.html" %}

{% block title %}Login - Immigration Portal{% endblock %}

{% block content %}
    <h2>Login to Your Account</h2>
    <p>Access your case status and secure documents.</p>
    
    <form action="{{ url_for('auth.login') }}" method="POST">
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>
        
        <label for="password">Password:</label><br>
        <div class="password-group">
            <input type="password" id="password" name="password" required>
            <button type="button" id="loginToggleBtn" class="toggle-btn" onclick="togglePasswordVisibility('password', 'loginToggleBtn')">Show</button>
        </div>
        <br><br>
        
        <button type="submit">Sign In</button>
    </form>

    <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
{% endblock %}
