{% extends "base.html" %}

{% block title %}Register - Immigration Portal{% endblock %}

{% block content %}
    <h2>Create an Account</h2>
    <p>Sign up to track your immigration cases and upload documents.</p>
    
    <form action="{{ url_for('auth.register') }}" method="POST">
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>
        
        <label for="password">Password:</label><br>
        <div class="password-group">
            <input type="password" id="password" name="password" required>
            <button type="button" id="regToggleBtn" class="toggle-btn" onclick="togglePasswordVisibility('password', 'regToggleBtn')">Show</button>
        </div>
        <br><br>
        
        <button type="submit">Register</button>
    </form>
    
    <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>.</p>
{% endblock %}
