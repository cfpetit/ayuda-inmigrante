{% extends "base.html" %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<div class="container mt-4">
    <div class="card shadow-sm border-0 col-md-8 mx-auto">
        <div class="card-header bg-white border-bottom fw-bold text-cylcae py-3">
            {% if listing %}{{ _('Edit Listing') }} #{{ listing.id }}{% else %}{{ _('Add New Property / Business Listing') }}{% endif %}
        </div>
        <div class="card-body p-4">
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('Title') }}</label>
                    <input type="text" name="title" class="form-control" value="{{ listing.title if listing else '' }}" required placeholder="e.g. Modern Apartment in City Center">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">{{ _('Listing Category') }}</label>
                        <select name="listing_type" class="form-select" required>
                            <option value="Sale" {% if listing and listing.listing_type == 'Sale' %}selected{% endif %}>{{ _('For Sale') }}</option>
                            <option value="Lease" {% if listing and listing.listing_type == 'Lease' %}selected{% endif %}>{{ _('On Lease / Rent') }}</option>
                            <option value="Business" {% if listing and listing.listing_type == 'Business' %}selected{% endif %}>{{ _('Business Opportunity') }}</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">{{ _('Property Type') }}</label>
                        <select name="property_type" class="form-select" required>
                            <option value="House" {% if listing and listing.property_type == 'House' %}selected{% endif %}>{{ _('House') }}</option>
                            <option value="Apartment" {% if listing and listing.property_type == 'Apartment' %}selected{% endif %}>{{ _('Apartment') }}</option>
                            <option value="Commercial Space" {% if listing and listing.property_type == 'Commercial Space' %}selected{% endif %}>{{ _('Commercial Space') }}</option>
                            <option value="Land" {% if listing and listing.property_type == 'Land' %}selected{% endif %}>{{ _('Land') }}</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">{{ _('Price') }} (€)</label>
                        <input type="number" step="0.01" name="price" class="form-control" value="{{ listing.price if listing else '' }}" required placeholder="250000">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">{{ _('Price Breakdown') }}</label>
                        <select name="price_period" class="form-select">
                            <option value="Total" {% if listing and listing.price_period == 'Total' %}selected{% endif %}>{{ _('Total Price') }}</option>
                            <option value="/month" {% if listing and listing.price_period == '/month' %}selected{% endif %}>{{ _('Per Month') }}</option>
                            <option value="/year" {% if listing and listing.price_period == '/year' %}selected{% endif %}>{{ _('Per Year') }}</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('Location / Address') }}</label>
                    <input type="text" name="location" class="form-control" value="{{ listing.location if listing else '' }}" required placeholder="Madrid, Spain">
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">{{ _('Bedrooms') }}</label>
                        <input type="number" name="bedrooms" class="form-control" value="{{ listing.bedrooms if listing else '' }}" placeholder="3">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">{{ _('Bathrooms') }}</label>
                        <input type="number" name="bathrooms" class="form-control" value="{{ listing.bathrooms if listing else '' }}" placeholder="2">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">{{ _('Area') }} (m²)</label>
                        <input type="number" step="0.1" name="area_sqm" class="form-control" value="{{ listing.area_sqm if listing else '' }}" placeholder="120">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('Description') }}</label>
                    <div id="reqEditor" style="min-height: 100px; background: #fff;">
                        <textarea name="description" class="form-control" rows="5" required>{{ listing.description if listing else '' }}</textarea>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">{{ _('Contact Email') }}</label>
                        <input type="email" name="contact_email" class="form-control" value="{{ listing.contact_email if listing else '' }}" placeholder="info@cylcae.es">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">{{ _('Contact Phone') }}</label>
                        <input type="text" name="contact_phone" class="form-control" value="{{ listing.contact_phone if listing else '' }}" placeholder="+34 600 000 000">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('Property Image') }}</label>
                    <input type="file" name="image" class="form-control" accept="image/*">
                    {% if listing and listing.image_url %}
                        <div class="mt-2">
                            <img src="{{ listing.image_url }}" alt="Preview" class="img-thumbnail" style="height: 100px;">
                        </div>
                    {% endif %}
                </div>

                {% if listing %}
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="is_available" id="is_available" {% if listing.is_available %}checked{% endif %}>
                    <label class="form-check-label" for="is_available">{{ _('Available for public viewing') }}</label>
                </div>
                {% endif %}

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
                    <button type="submit" class="btn btn-cylcae">{{ _('Save Listing') }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
    const descQuill = new Quill('#descEditor', { theme: 'snow', placeholder: 'Job description...' });
    const reqQuill = new Quill('#reqEditor', { theme: 'snow', placeholder: 'Candidate requirements...' });

    document.getElementById('jobForm').onsubmit = function() {
        document.getElementById('hiddenDescription').value = descQuill.root.innerHTML;
        document.getElementById('hiddenRequirements').value = reqQuill.root.innerHTML;
    };
</script>
{% endblock %}
