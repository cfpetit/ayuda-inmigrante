{% extends 'base.html' %}

{% block content %}
<!-- Quill CSS -->
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

<div class="col-md-8 mx-auto card shadow-sm p-4 my-4">
    <h3 class="text-cylcae fw-bold mb-3">{% if post %}Edit{% else %}New{% endif %} Article / News</h3>
    
    <form method="POST" enctype="multipart/form-data" id="editorForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
            <label class="form-label font-weight-bold">Title</label>
            <input type="text" name="title" class="form-control" value="{{ post.title if post else '' }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
                <option value="News" {% if post and post.category == 'News' %}selected{% endif %}>News</option>
                <option value="Interview" {% if post and post.category == 'Interview' %}selected{% endif %}>Interview</option>
            </select>
        </div>

        <!-- Hidden input storing HTML generated by Quill -->
        <input type="hidden" name="content" id="hiddenContent">

        <div class="mb-3">
            <label class="form-label">Content</label>
            <div id="editor" style="min-height: 200px; background: #fff;">
                {% if post %}{{ post.content|safe }}{% endif %}
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Featured Image (Cloudinary)</label>
            <input type="file" name="image" class="form-control" accept="image/*">
        </div>

        <div class="mb-3">
            <label class="form-label">Attachment / PDF Document (Optional)</label>
            <input type="file" name="document" class="form-control">
        </div>

        <button type="submit" class="btn btn-cylcae w-100 mt-3">Publish Article</button>
    </form>
</div>

<!-- Quill JS Script -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
    const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write your article or interview here...'
    });

    document.getElementById('editorForm').onsubmit = function() {
        document.getElementById('hiddenContent').value = quill.root.innerHTML;
    };
</script>
{% endblock %}
